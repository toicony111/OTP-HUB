<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OTP Hub Tool Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2)}
body{display:flex;justify-content:center;align-items:center;padding:4px}
.container{background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.2);padding:8px;max-width:400px;width:100%;height:100vh;display:flex;flex-direction:column;gap:5px}
h1{text-align:center;font-size:16px;color:#333}
.box{background:#f8f9fa;border:1px solid #ddd;border-radius:6px;padding:7px}
.row{display:flex;gap:4px}
input,select{padding:6px;border:2px solid #ddd;border-radius:4px;font-size:12px}
input{flex:1}
button{border:0;border-radius:4px;padding:7px;color:#fff;font-weight:700;font-size:11px;cursor:pointer}
button:disabled{opacity:.5;pointer-events:none}
button:active{transform:scale(.98);opacity:.85}
.primary{background:linear-gradient(135deg,#667eea,#764ba2)}
.success{background:#28a745}
.danger{background:#ff6b6b}
.info{background:#17a2b8}
.gray{background:#6c757d}
.status{font-size:10px;text-align:center;padding:5px;border-radius:4px}
.idle{background:#e2e3e5;color:#383d41}
.ok{background:#d4edda;color:#155724}
.err{background:#f8d7da;color:#721c24}
.wait{background:#fff3cd;color:#856404}
.scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
h2{font-size:11px;color:#555;margin-bottom:5px}
.display{background:#fff;border:2px solid #667eea;border-radius:4px;padding:7px;text-align:center;font-weight:700;font-size:14px;word-break:break-all;margin-top:5px}
.otp{border-color:#ffc107;font-size:17px;letter-spacing:2px;min-height:38px;display:flex;align-items:center;justify-content:center}
.otp.waiting{font-size:11px;color:#888;font-weight:400;letter-spacing:0}
.feedback{height:14px;text-align:center;font-size:9px;color:#28a745;opacity:0;transition:.25s}
.feedback.show{opacity:1}
.info-line{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap;background:#fff3cd;border:1px solid #ffc107;color:#856404;border-radius:4px;font-size:9px;padding:4px;margin-top:5px}
.debug{display:none;background:#111;color:#00ff00;font-family:monospace;font-size:8px;line-height:1.4;max-height:90px;overflow:auto;padding:5px;border-radius:4px;margin-top:5px}
.small{padding:6px;font-size:10px}
</style>
</head>
<body>
<div class="container">
  <h1>🔧 OTP Hub Tool Fixed</h1>

  <div class="box">
    <div class="row">
      <input id="apiKey" type="password" placeholder="Nhập API Key..." autocomplete="off">
      <button class="primary" id="btnConnect" onclick="connectAPI()">Kết nối</button>
    </div>
    <div style="font-size:10px;margin-top:4px;color:#666">
      <input type="checkbox" id="saveKey" checked style="width:auto"> Lưu Key
      <span style="margin-left:8px">Country US: <b>1</b> | Service: <b>1722</b></span>
    </div>
  </div>

  <div id="status" class="status idle">⚡ Nhập API Key và nhấn Kết nối</div>

  <div class="scroll">
    <div class="box">
      <h2>📱 Thuê số US - Rips By Triumph</h2>
      <div class="row">
        <button class="primary" id="btnRent" onclick="rentPhone()" disabled style="flex:1">📞 Thuê số mới</button>
        <button class="gray small" id="btnCancel" onclick="cancelOrder()" disabled>❌ Hủy</button>
      </div>

      <div id="phoneBox" class="display" style="display:none">📱 <span id="phoneText"></span></div>
      <div id="otpBox" class="display otp waiting">⏳ Chưa có code</div>

      <div class="row" id="otpActions" style="display:none;margin-top:5px">
        <button class="info small" onclick="copyOTP()" style="flex:1">📋 Copy Code</button>
        <button class="danger small" id="btnResend" onclick="resendSMS()" style="flex:1">🔄 Gửi lại</button>
      </div>

      <div id="orderInfo" class="info-line" style="display:none">
        <span>ID: <b id="orderIdText"></b></span>
        <span>Hết hạn: <b id="expiresText">N/A</b>s</span>
        <span>Poll: <b id="pollText">0</b></span>
      </div>

      <div class="feedback" id="phoneFb">✅ Đã copy số!</div>
      <div class="feedback" id="otpFb">✅ Đã copy code!</div>
      <div class="debug" id="debug"></div>
    </div>

    <div class="box">
      <h2>🎲 Random 01-10</h2>
      <button class="success" onclick="random1to10()" style="width:100%">Random & Copy</button>
      <div class="feedback" id="r1Fb">✅ Đã copy!</div>
    </div>

    <div class="box">
      <h2>🎰 Random 1975-2002</h2>
      <button class="danger" onclick="random1975to2002()" style="width:100%">Random & Copy</button>
      <div class="feedback" id="r2Fb">✅ Đã copy!</div>
    </div>

    <div class="box">
      <h2>✏️ Chuỗi tùy chỉnh</h2>
      <div class="row">
        <input id="customText" value="DMXFXQD">
        <button class="info small" onclick="copyCustomString()">Copy</button>
      </div>
      <div class="feedback" id="customFb">✅ Đã copy!</div>
    </div>
  </div>
</div>

<script>
const BASE_URL = 'https://api.otphub.net/api/v1';
const COUNTRY_ID = '1';
const SERVICE_ID = '1722';

let API_KEY = '';
let currentOrderId = '';
let currentOTP = '';
let phoneNumber = '';
let pollTimer = null;
let pollCount = 0;
const MAX_POLL = 120;

const $ = id => document.getElementById(id);

function log(msg, data=null){
  const line = `[${new Date().toLocaleTimeString()}] ${msg}` + (data ? ' | ' + JSON.stringify(data).slice(0,220) : '');
  console.log(line, data || '');
  $('debug').style.display = 'block';
  $('debug').innerHTML = line + '<br>' + $('debug').innerHTML;
  $('debug').innerHTML = $('debug').innerHTML.split('<br>').slice(0,16).join('<br>');
}

function setStatus(text, cls='idle'){
  $('status').textContent = text;
  $('status').className = 'status ' + cls;
}

function apiUrl(endpoint){
  const joiner = endpoint.includes('?') ? '&' : '?';
  return `${BASE_URL}${endpoint}${joiner}key=${encodeURIComponent(API_KEY)}`;
}

async function apiCall(endpoint, method='GET', body=null){
  if(!API_KEY) throw new Error('Chưa nhập API Key');

  const options = {
    method,
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': API_KEY
    }
  };

  if(body && method !== 'GET'){
    options.body = JSON.stringify(body);
  }

  const url = apiUrl(endpoint);
  log(`🔄 ${method} ${endpoint}`, body);

  const res = await fetch(url, options);
  const text = await res.text();

  let data;
  try {
    data = JSON.parse(text);
  } catch(e) {
    throw new Error(`Response không phải JSON: ${text.slice(0,120)}`);
  }

  log(`📡 HTTP ${res.status}`, data);

  if(!res.ok){
    throw new Error(data.message || data.error || `HTTP ${res.status}`);
  }

  return data;
}

function connectAPI(){
  const key = $('apiKey').value.trim();
  if(!key){
    setStatus('❌ Vui lòng nhập API Key', 'err');
    return;
  }

  API_KEY = key;

  if($('saveKey').checked){
    localStorage.setItem('otphub_api_key_fixed', API_KEY);
  } else {
    localStorage.removeItem('otphub_api_key_fixed');
  }

  $('btnRent').disabled = false;
  setStatus('✅ Đã sẵn sàng | US=1 | Rips By Triumph=1722', 'ok');
  log('✅ Connected locally. Không gọi /services nữa.');
}

async function rentPhone(){
  if(!API_KEY){
    setStatus('❌ Chưa kết nối API Key', 'err');
    return;
  }

  stopPolling();
  resetOrderUI(false);

  $('btnRent').disabled = true;
  $('btnRent').textContent = '⏳ Đang thuê...';

  try{
    const body = {
      country: COUNTRY_ID,
      service: SERVICE_ID
    };

    const data = await apiCall('/order', 'POST', body);

    if(!data.success || !data.data || !data.data.order_id){
      throw new Error(data.message || 'API không trả order_id');
    }

    currentOrderId = data.data.order_id;
    phoneNumber = cleanUSPhone(data.data.phone || '');

    $('phoneBox').style.display = 'block';
    $('phoneText').textContent = phoneNumber || data.data.phone || 'N/A';

    $('orderInfo').style.display = 'flex';
    $('orderIdText').textContent = currentOrderId;
    $('expiresText').textContent = data.data.expires_in ?? 'N/A';
    $('pollText').textContent = '0';

    $('otpBox').textContent = '⏳ Đang chờ code...';
    $('otpBox').className = 'display otp waiting';

    $('btnCancel').disabled = false;
    $('btnResend').disabled = false;

    if(phoneNumber){
      await copyText(phoneNumber);
      showFeedback('phoneFb');
    }

    setStatus('✅ Thuê số thành công, đang chờ OTP...', 'ok');
    log('📞 ORDER CREATED', data.data);

    startPolling();

  }catch(err){
    setStatus('❌ Lỗi thuê số: ' + err.message, 'err');
    log('❌ Rent error: ' + err.message);
    resetOrderUI(true);
  }finally{
    $('btnRent').disabled = false;
    $('btnRent').textContent = '📞 Thuê số mới';
  }
}

function cleanUSPhone(phone){
  let p = String(phone).replace(/\D/g,'');
  if(p.startsWith('1') && p.length === 11) p = p.slice(1);
  return p;
}

function startPolling(){
  stopPolling();
  pollCount = 0;
  currentOTP = '';
  pollOTP();
  pollTimer = setInterval(pollOTP, 5000);
}

async function pollOTP(){
  if(!currentOrderId) return;

  pollCount++;
  $('pollText').textContent = pollCount;

  if(pollCount > MAX_POLL){
    stopPolling();
    $('otpBox').textContent = '⏰ Hết thời gian chờ';
    $('otpBox').className = 'display otp waiting';
    setStatus('⏰ Hết thời gian chờ OTP', 'wait');
    return;
  }

  try{
    const data = await apiCall(`/order/${encodeURIComponent(currentOrderId)}`, 'GET');

    if(!data.success || !data.data) return;

    const d = data.data;

    if(d.expires_in !== undefined){
      $('expiresText').textContent = d.expires_in;
    }

    let otp = extractOTP(d);

    log(`🔍 Poll #${pollCount} | status=${d.status} | otp=${otp || 'null'}`);

    if(otp && otp !== currentOTP){
      currentOTP = otp;
      $('otpBox').textContent = otp;
      $('otpBox').className = 'display otp';
      $('otpActions').style.display = 'flex';

      await copyText(otp);
      showFeedback('otpFb');

      setStatus('✅ Đã nhận OTP: ' + otp, 'ok');
      log('🎉 OTP RECEIVED: ' + otp, d);

      if(d.status === 'completed'){
        stopPolling();
      }
    }

    if(d.status === 'completed' && !otp){
      stopPolling();
      setStatus('⚠️ Order completed nhưng chưa thấy OTP field', 'wait');
    }

  }catch(err){
    log('❌ Poll error: ' + err.message);
  }
}

function extractOTP(d){
  if(d.otp && String(d.otp).trim() && String(d.otp).toLowerCase() !== 'null'){
    return String(d.otp).trim();
  }

  if(d.code && String(d.code).trim() && String(d.code).toLowerCase() !== 'null'){
    return String(d.code).trim();
  }

  if(d.full_sms){
    const match = String(d.full_sms).match(/\b(\d{4,8})\b/);
    if(match) return match[1];
  }

  return '';
}

async function cancelOrder(){
  if(!currentOrderId) return;

  try{
    const oid = currentOrderId;
    const data = await apiCall(`/order/${encodeURIComponent(oid)}/cancel`, 'POST');

    stopPolling();
    resetOrderUI(true);

    const refund = data.data?.refunded_amount ?? data.refunded_amount ?? '?';
    setStatus('✅ Đã hủy order. Refund: ' + refund, 'ok');
    log('✅ Cancel success', data);

  }catch(err){
    setStatus('❌ Lỗi hủy: ' + err.message, 'err');
    log('❌ Cancel error: ' + err.message);
  }
}

async function resendSMS(){
  if(!currentOrderId) return;

  $('btnResend').disabled = true;
  $('btnResend').textContent = '⏳...';

  try{
    const data = await apiCall(`/order/${encodeURIComponent(currentOrderId)}/resend`, 'POST');

    currentOTP = '';
    pollCount = 0;
    $('otpBox').textContent = '⏳ Đang chờ code...';
    $('otpBox').className = 'display otp waiting';
    $('otpActions').style.display = 'none';

    setStatus('✅ Đã yêu cầu gửi lại SMS', 'ok');
    log('🔄 Resend success', data);

    startPolling();

  }catch(err){
    setStatus('❌ Lỗi gửi lại: ' + err.message, 'err');
    log('❌ Resend error: ' + err.message);
  }finally{
    $('btnResend').disabled = false;
    $('btnResend').textContent = '🔄 Gửi lại';
  }
}

function stopPolling(){
  if(pollTimer){
    clearInterval(pollTimer);
    pollTimer = null;
    log('⏹️ Stop polling');
  }
}

function resetOrderUI(clearAll=true){
  if(clearAll){
    currentOrderId = '';
    currentOTP = '';
    phoneNumber = '';
  }

  $('phoneBox').style.display = 'none';
  $('orderInfo').style.display = 'none';
  $('otpActions').style.display = 'none';

  $('otpBox').textContent = '⏳ Chưa có code';
  $('otpBox').className = 'display otp waiting';

  $('btnCancel').disabled = true;
  $('btnResend').disabled = true;
}

async function copyOTP(){
  if(currentOTP){
    await copyText(currentOTP);
    showFeedback('otpFb');
  }
}

async function random1to10(){
  const n = Math.floor(Math.random() * 10) + 1;
  await copyText(String(n).padStart(2,'0'));
  showFeedback('r1Fb');
}

async function random1975to2002(){
  const n = Math.floor(Math.random() * (2002 - 1975 + 1)) + 1975;
  await copyText(String(n));
  showFeedback('r2Fb');
}

async function copyCustomString(){
  const str = $('customText').value.trim();
  if(!str) return;
  await copyText(str);
  showFeedback('customFb');
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

function showFeedback(id){
  const el = $(id);
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1200);
}

$('apiKey').addEventListener('keypress', e => {
  if(e.key === 'Enter') connectAPI();
});

$('saveKey').addEventListener('change', () => {
  if($('saveKey').checked && API_KEY){
    localStorage.setItem('otphub_api_key_fixed', API_KEY);
  }else{
    localStorage.removeItem('otphub_api_key_fixed');
  }
});

window.addEventListener('beforeunload', stopPolling);

(function init(){
  const saved = localStorage.getItem('otphub_api_key_fixed');
  if(saved){
    $('apiKey').value = saved;
    $('saveKey').checked = true;
  }
  log('🚀 Tool started | Fixed API: country=1 service=1722');
})();
</script>
</body>
</html>
