<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OTP Hub Tool v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            font-size: 24px;
            font-weight: 700;
        }

        .section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #e9ecef;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            background: white;
        }

        input[type="password"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .api-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .api-row input {
            flex: 1;
            min-width: 150px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            white-space: nowrap;
        }

        button:active {
            transform: scale(0.98);
            opacity: 0.8;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            flex: 1;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .btn-random-green {
            background: #28a745;
            color: white;
        }

        .btn-random-red {
            background: #dc3545;
            color: white;
        }

        .phone-display {
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #333;
            letter-spacing: 1px;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.2s;
            word-break: break-all;
        }

        .phone-display:active {
            background: #f0f0ff;
        }

        .otp-display {
            background: white;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 8px 0;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            word-break: break-all;
        }

        .otp-waiting {
            color: #6c757d;
            font-weight: 400;
        }

        .otp-timeout {
            color: #dc3545;
            font-weight: 400;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6c757d;
            margin: 4px 0;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #495057;
        }

        select {
            padding: 8px 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 13px;
            background: white;
            flex: 1;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-connected {
            background: #d4edda;
            color: #155724;
        }

        .status-disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .debug-panel {
            background: #1a1a1a;
            color: #00ff00;
            font-family: monospace;
            font-size: 8px;
            padding: 8px;
            border-radius: 8px;
            max-height: 80px;
            overflow-y: auto;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .feedback-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .feedback-toast.show {
            opacity: 1;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .button-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .button-row button {
            flex: 1;
            min-width: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 OTP Hub Tool v2</h1>

        <!-- API Key Section -->
        <div class="section">
            <div class="section-title">🔐 API Key</div>
            <div class="api-row">
                <input type="password" id="apiKeyInput" placeholder="Nhập API Key...">
                <button class="btn-primary" id="connectBtn" onclick="connectAPI()">
                    <span id="connectBtnText">🔌 Kết nối</span>
                </button>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
                <div class="checkbox-row">
                    <input type="checkbox" id="saveKeyCheckbox">
                    <label for="saveKeyCheckbox">💾 Lưu Key</label>
                </div>
                <select id="modeSelect" onchange="updateMode()">
                    <option value="direct">Direct API</option>
                    <option value="proxy">CORS Proxy</option>
                </select>
                <span id="statusBadge" class="status-badge status-disconnected">Chưa kết nối</span>
            </div>
        </div>

        <!-- Order Section -->
        <div class="section">
            <div class="section-title">📞 Thuê số (US - Rips By TriumPh)</div>
            <button class="btn-primary" id="orderBtn" onclick="createOrder()" disabled>
                📞 Thuê số mới
            </button>
            <div class="phone-display" id="phoneDisplay" onclick="copyPhone()">
                Chưa có số
            </div>
            <div class="button-row">
                <button class="btn-secondary" id="cancelBtn" onclick="cancelOrder()" disabled>❌ Hủy</button>
                <button class="btn-danger" id="resendBtn" onclick="resendSMS()" disabled>🔄 Gửi lại</button>
            </div>
        </div>

        <!-- OTP Section -->
        <div class="section">
            <div class="section-title">📨 Nhận OTP</div>
            <div class="otp-display" id="otpDisplay">
                <span class="otp-waiting">⏳ Đang chờ code...</span>
            </div>
            <button class="btn-info" id="copyOtpBtn" onclick="copyOTP()" disabled>📋 Copy Code</button>
            <div class="info-row">
                <span>Order ID: <strong id="orderIdInfo">---</strong></span>
                <span>Hết hạn: <strong id="expiresInfo">---</strong></span>
                <span>Resend: <strong id="resendCountInfo">0</strong></span>
            </div>
        </div>

        <!-- Random & Custom Section -->
        <div class="section">
            <div class="section-title">🎲 Random & ✏️ Tùy chỉnh</div>
            <div class="button-row" style="margin-bottom: 8px;">
                <button class="btn-random-green" onclick="random1to10()">🎲 01-10</button>
                <button class="btn-random-red" onclick="random1975to2002()">🎰 1975-2002</button>
            </div>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="customString" value="DMXFXQD" placeholder="Nhập chuỗi...">
                <button class="btn-info" onclick="copyCustom()">📋 Copy</button>
            </div>
        </div>

        <!-- Debug Panel -->
        <div class="section">
            <div class="section-title">🔍 Debug Log</div>
            <div class="debug-panel" id="debugPanel">
                [INFO] Tool sẵn sàng...
            </div>
        </div>
    </div>

    <div class="feedback-toast" id="feedbackToast"></div>

    <script>
        // ============ STATE ============
        const API_BASE = 'https://api.otphub.net/api/v1';
        const PROXY_BASE = 'https://api.allorigins.win/raw?url=';
        const SERVICE_NAME = 'Rips By TriumPh';
        const SERVICE_ID = '1722';
        const COUNTRY_ID = '1';

        let state = {
            apiKey: '',
            mode: 'direct',
            connected: false,
            serviceId: SERVICE_ID,
            currentOrder: null,
            pollingInterval: null,
            pollCount: 0,
            maxPolls: 120,
            currentOTP: null,
            resendCount: 0,
            debugLines: []
        };

        // ============ INIT ============
        function init() {
            loadSavedKey();
            updateMode();
            addDebug('🚀 Tool khởi động', 'INFO');
            addDebug(`🎯 Dịch vụ: ${SERVICE_NAME} (ID: ${SERVICE_ID})`, 'INFO');
            addDebug(`🌍 Quốc gia: US (ID: ${COUNTRY_ID})`, 'INFO');
        }

        function loadSavedKey() {
            const saved = localStorage.getItem('otphub_api_key_v2');
            if (saved) {
                document.getElementById('apiKeyInput').value = saved;
                document.getElementById('saveKeyCheckbox').checked = true;
                addDebug('💾 Đã load API Key từ localStorage', 'INFO');
                // Tự động kết nối nếu có key
                setTimeout(() => connectAPI(), 300);
            }
        }

        // ============ DEBUG ============
        function addDebug(message, type = 'INFO') {
            const now = new Date();
            const time = now.toLocaleTimeString('vi-VN', { hour12: false });
            const prefix = {
                'INFO': '📘',
                'REQUEST': '🔄',
                'RESPONSE': '📡',
                'ORDER': '📞',
                'OTP': '🎉',
                'ERROR': '❌',
                'CONNECT': '🔌'
            } [type] || '📘';

            const line = `[${time}] ${prefix} ${message}`;
            state.debugLines.push(line);

            // Giữ 15 dòng gần nhất
            if (state.debugLines.length > 15) {
                state.debugLines = state.debugLines.slice(-15);
            }

            const panel = document.getElementById('debugPanel');
            if (panel) {
                panel.textContent = state.debugLines.join('\n');
                panel.scrollTop = panel.scrollHeight;
            }

            console.log(`[OTP Hub] ${line}`);
        }

        // ============ TOAST ============
        function showToast(message) {
            const toast = document.getElementById('feedbackToast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1200);
        }

        // ============ API KEY ============
        function updateMode() {
            state.mode = document.getElementById('modeSelect').value;
            addDebug(`🔌 Chế độ: ${state.mode === 'direct' ? 'Direct API' : 'CORS Proxy'}`, 'CONNECT');
        }

        function getBaseURL() {
            if (state.mode === 'proxy') {
                return PROXY_BASE + encodeURIComponent(API_BASE);
            }
            return API_BASE;
        }

        async function apiRequest(method, endpoint, body = null, useKey = true) {
            let url = `${getBaseURL()}${endpoint}`;

            // Nếu là direct mode, thêm key vào URL
            if (state.mode === 'direct' && useKey && state.apiKey) {
                const separator = endpoint.includes('?') ? '&' : '?';
                url = `${API_BASE}${endpoint}${separator}key=${state.apiKey}`;
            } else if (state.mode === 'proxy' && useKey && state.apiKey) {
                const separator = endpoint.includes('?') ? '&' : '?';
                const fullEndpoint = `${endpoint}${separator}key=${state.apiKey}`;
                url = PROXY_BASE + encodeURIComponent(API_BASE + fullEndpoint);
            }

            const headers = {
                'Content-Type': 'application/json',
            };

            // Thêm x-api-key header cho cả 2 mode
            if (useKey && state.apiKey) {
                headers['x-api-key'] = state.apiKey;
            }

            const options = {
                method: method,
                headers: headers,
            };

            if (body && method !== 'GET') {
                options.body = JSON.stringify(body);
            }

            addDebug(`${method} ${endpoint}`, 'REQUEST');
            if (body) {
                addDebug(`Body: ${JSON.stringify(body)}`, 'REQUEST');
            }

            try {
                const response = await fetch(url, options);
                const data = await response.json();

                addDebug(`Status: ${response.status}`, 'RESPONSE');
                addDebug(`Data: ${JSON.stringify(data).substring(0, 100)}`, 'RESPONSE');

                if (!data.success && data.error) {
                    throw new Error(data.error || data.message || 'Lỗi API');
                }

                return data;
            } catch (error) {
                addDebug(`Lỗi: ${error.message}`, 'ERROR');

                // Auto-fallback nếu direct bị lỗi CORS
                if (state.mode === 'direct' && error.message.includes('Failed to fetch')) {
                    addDebug('⚠️ Có thể lỗi CORS, thử chuyển sang Proxy...', 'ERROR');
                    document.getElementById('modeSelect').value = 'proxy';
                    updateMode();
                    // Thử lại với proxy
                    return apiRequest(method, endpoint, body, useKey);
                }

                throw error;
            }
        }

        async function connectAPI() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                showToast('❌ Vui lòng nhập API Key!');
                addDebug('❌ API Key trống', 'ERROR');
                return;
            }

            state.apiKey = apiKey;
            const connectBtn = document.getElementById('connectBtn');
            const connectBtnText = document.getElementById('connectBtnText');
            const statusBadge = document.getElementById('statusBadge');

            connectBtn.disabled = true;
            connectBtnText.innerHTML = '<span class="spinner"></span> Đang kết nối...';
            statusBadge.textContent = 'Đang kết nối...';
            statusBadge.className = 'status-badge';
            addDebug('🔌 Đang xác thực API Key...', 'CONNECT');

            try {
                // Thử lấy danh sách dịch vụ để xác thực
                const data = await apiRequest('GET', '/services', null, true);

                if (data.success) {
                    state.connected = true;
                    state.serviceId = SERVICE_ID;

                    // Tìm dịch vụ trong danh sách
                    if (data.data && Array.isArray(data.data)) {
                        let found = data.data.find(s =>
                            s.name === SERVICE_NAME ||
                            s.name?.toLowerCase() === SERVICE_NAME.toLowerCase() ||
                            (s.name?.toLowerCase().includes('rips') && s.name?.toLowerCase().includes('triumph'))
                        );

                        if (found) {
                            state.serviceId = found.id || found.code || SERVICE_ID;
                            addDebug(`✅ Tìm thấy dịch vụ: ${found.name} (ID: ${state.serviceId})`, 'CONNECT');
                        } else {
                            addDebug(`⚠️ Không tìm thấy "${SERVICE_NAME}", dùng ID mặc định: ${SERVICE_ID}`, 'CONNECT');
                        }
                    }

                    statusBadge.textContent = '✅ Đã kết nối';
                    statusBadge.className = 'status-badge status-connected';
                    document.getElementById('orderBtn').disabled = false;
                    showToast('✅ Kết nối thành công!');

                    // Lưu key nếu được chọn
                    if (document.getElementById('saveKeyCheckbox').checked) {
                        localStorage.setItem('otphub_api_key_v2', apiKey);
                        addDebug('💾 Đã lưu API Key', 'INFO');
                    }
                }
            } catch (error) {
                state.connected = false;
                statusBadge.textContent = '❌ Lỗi kết nối';
                statusBadge.className = 'status-badge status-disconnected';
                document.getElementById('orderBtn').disabled = true;
                showToast('❌ Kết nối thất bại!');
                addDebug(`❌ Lỗi: ${error.message}`, 'ERROR');
            } finally {
                connectBtn.disabled = false;
                connectBtnText.textContent = '🔌 Kết nối';
            }
        }

        // Cho phép Enter để kết nối
        document.addEventListener('DOMContentLoaded', () => {
            init();
            document.getElementById('apiKeyInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    connectAPI();
                }
            });
        });

        // ============ ORDER ============
        async function createOrder() {
            if (!state.connected) {
                showToast('❌ Vui lòng kết nối API trước!');
                return;
            }

            // Dừng polling cũ nếu có
            stopPolling();

            const orderBtn = document.getElementById('orderBtn');
            orderBtn.disabled = true;
            orderBtn.innerHTML = '<span class="spinner"></span> Đang tạo order...';
            addDebug('📞 Đang tạo order mới...', 'ORDER');

            try {
                const data = await apiRequest('POST', '/order', {
                    country: COUNTRY_ID,
                    service: state.serviceId
                }, true);

                if (data.success && data.data) {
                    state.currentOrder = data.data;
                    state.pollCount = 0;
                    state.currentOTP = null;
                    state.resendCount = 0;

                    const phone = data.data.phone || '';
                    const cleanPhone = phone.replace(/^\+1\s*/, '').replace(/\s/g, '');

                    document.getElementById('phoneDisplay').textContent = cleanPhone || phone;
                    document.getElementById('orderIdInfo').textContent = data.data.order_id || '---';
                    document.getElementById('expiresInfo').textContent = (data.data.expires_in || '---') + 's';
                    document.getElementById('resendCountInfo').textContent = '0';
                    document.getElementById('otpDisplay').innerHTML = '<span class="otp-waiting">⏳ Đang chờ code...</span>';
                    document.getElementById('cancelBtn').disabled = false;
                    document.getElementById('resendBtn').disabled = false;
                    document.getElementById('copyOtpBtn').disabled = true;

                    addDebug(`✅ Order created: ${data.data.order_id}`, 'ORDER');
                    addDebug(`📱 Phone: ${cleanPhone}`, 'ORDER');

                    // Tự động copy số
                    await copyToClipboard(cleanPhone);
                    showToast('✅ Đã copy số!');

                    // Bắt đầu polling ngay
                    pollOTP(true);
                } else {
                    throw new Error('Không nhận được order_id');
                }
            } catch (error) {
                addDebug(`❌ Lỗi tạo order: ${error.message}`, 'ERROR');
                showToast('❌ Tạo order thất bại!');
                resetOrderUI();
            } finally {
                orderBtn.disabled = false;
                orderBtn.innerHTML = '📞 Thuê số mới';
            }
        }

        function resetOrderUI() {
            document.getElementById('phoneDisplay').textContent = 'Chưa có số';
            document.getElementById('orderIdInfo').textContent = '---';
            document.getElementById('expiresInfo').textContent = '---';
            document.getElementById('resendCountInfo').textContent = '0';
            document.getElementById('otpDisplay').innerHTML = '<span class="otp-waiting">⏳ Đang chờ code...</span>';
            document.getElementById('cancelBtn').disabled = true;
            document.getElementById('resendBtn').disabled = true;
            document.getElementById('copyOtpBtn').disabled = true;
            state.currentOrder = null;
            state.currentOTP = null;
            state.resendCount = 0;
            stopPolling();
        }

        // ============ POLLING OTP ============
        async function pollOTP(immediate = false) {
            if (!state.currentOrder || !state.currentOrder.order_id) {
                addDebug('⚠️ Không có order để poll', 'ERROR');
                return;
            }

            const orderId = state.currentOrder.order_id;

            if (immediate) {
                stopPolling();
                await checkOTP(orderId);
            }

            state.pollingInterval = setInterval(async () => {
                state.pollCount++;
                addDebug(`🔄 Poll #${state.pollCount}/${state.maxPolls}`, 'OTP');

                if (state.pollCount > state.maxPolls) {
                    stopPolling();
                    document.getElementById('otpDisplay').innerHTML = '<span class="otp-timeout">⏰ Hết thời gian chờ</span>';
                    addDebug('⏰ Hết thời gian chờ (10 phút)', 'OTP');
                    return;
                }

                await checkOTP(orderId);
            }, 5000);
        }

        async function checkOTP(orderId) {
            try {
                const data = await apiRequest('GET', `/order/${orderId}`, null, true);

                if (data.success && data.data) {
                    const orderData = data.data;

                    // Cập nhật thông tin
                    if (orderData.expires_in !== undefined) {
                        document.getElementById('expiresInfo').textContent = orderData.expires_in + 's';
                    }

                    // Kiểm tra OTP
                    let otpValue = orderData.otp || orderData.code;

                    // Nếu không có otp/code, thử extract từ full_sms
                    if (!otpValue || otpValue === 'null' || otpValue === null) {
                        if (orderData.full_sms) {
                            const match = orderData.full_sms.match(/\b(\d{4,8})\b/);
                            if (match) {
                                otpValue = match[1];
                            }
                        }
                    }

                    // Kiểm tra OTP hợp lệ
                    if (otpValue && otpValue !== 'null' && otpValue !== null && otpValue !== state.currentOTP) {
                        state.currentOTP = otpValue;
                        document.getElementById('otpDisplay').textContent = otpValue;
                        document.getElementById('otpDisplay').style.color = '#333';
                        document.getElementById('copyOtpBtn').disabled = false;
                        addDebug(`🎉 OTP nhận được: ${otpValue}`, 'OTP');

                        // Tự động copy
                        await copyToClipboard(otpValue);
                        showToast('✅ Đã copy code!');

                        // Nếu status completed thì dừng poll
                        if (orderData.status === 'completed') {
                            stopPolling();
                            addDebug('✅ Order completed, dừng poll', 'OTP');
                        }
                    } else if (orderData.status === 'completed' && !state.currentOTP) {
                        // Status completed nhưng chưa có OTP
                        document.getElementById('otpDisplay').innerHTML = '<span class="otp-timeout">⏰ Đã hoàn thành - không có OTP</span>';
                        stopPolling();
                    }

                    // Cập nhật resend count nếu có
                    if (orderData.resend_count !== undefined) {
                        state.resendCount = orderData.resend_count;
                        document.getElementById('resendCountInfo').textContent = orderData.resend_count;
                    }
                }
            } catch (error) {
                addDebug(`❌ Lỗi poll OTP: ${error.message}`, 'ERROR');
            }
        }

        function stopPolling() {
            if (state.pollingInterval) {
                clearInterval(state.pollingInterval);
                state.pollingInterval = null;
                addDebug('⏹️ Đã dừng polling', 'INFO');
            }
        }

        // ============ CANCEL ORDER ============
        async function cancelOrder() {
            if (!state.currentOrder || !state.currentOrder.order_id) {
                showToast('❌ Không có order để hủy');
                return;
            }

            const orderId = state.currentOrder.order_id;
            const cancelBtn = document.getElementById('cancelBtn');
            cancelBtn.disabled = true;
            cancelBtn.innerHTML = '<span class="spinner"></span> Đang hủy...';
            addDebug(`❌ Đang hủy order: ${orderId}`, 'ORDER');

            try {
                const data = await apiRequest('POST', `/order/${orderId}/cancel`, {}, true);

                if (data.success) {
                    const refundAmount = data.data?.refunded_amount || '0';
                    showToast(`✅ Đã hủy! Hoàn: ${refundAmount}`);
                    addDebug(`✅ Order hủy thành công, hoàn: ${refundAmount}`, 'ORDER');
                }

                resetOrderUI();
            } catch (error) {
                addDebug(`❌ Lỗi hủy order: ${error.message}`, 'ERROR');
                showToast('❌ Hủy thất bại!');
            } finally {
                cancelBtn.disabled = false;
                cancelBtn.innerHTML = '❌ Hủy';
            }
        }

        // ============ RESEND SMS ============
        async function resendSMS() {
            if (!state.currentOrder || !state.currentOrder.order_id) {
                showToast('❌ Không có order để gửi lại');
                return;
            }

            const orderId = state.currentOrder.order_id;
            const resendBtn = document.getElementById('resendBtn');
            resendBtn.disabled = true;
            resendBtn.innerHTML = '<span class="spinner"></span> Đang gửi...';
            addDebug(`🔄 Đang gửi lại SMS: ${orderId}`, 'ORDER');

            try {
                const data = await apiRequest('POST', `/order/${orderId}/resend`, {}, true);

                if (data.success) {
                    state.resendCount++;
                    document.getElementById('resendCountInfo').textContent = state.resendCount;
                    state.currentOTP = null;
                    document.getElementById('otpDisplay').innerHTML = '<span class="otp-waiting">⏳ Đang chờ code...</span>';
                    document.getElementById('copyOtpBtn').disabled = true;
                    showToast('✅ Đã gửi lại SMS!');
                    addDebug('✅ Resend thành công', 'ORDER');

                    // Reset polling
                    state.pollCount = 0;
                    stopPolling();
                    pollOTP(true);
                }
            } catch (error) {
                addDebug(`❌ Lỗi resend: ${error.message}`, 'ERROR');
                showToast('❌ Gửi lại thất bại!');
            } finally {
                resendBtn.disabled = false;
                resendBtn.innerHTML = '🔄 Gửi lại';
            }
        }

        // ============ COPY FUNCTIONS ============
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (err) {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                return true;
            }
        }

        function copyPhone() {
            const phone = document.getElementById('phoneDisplay').textContent;
            if (phone && phone !== 'Chưa có số') {
                copyToClipboard(phone);
                showToast('✅ Đã copy số!');
            }
        }

        function copyOTP() {
            const otp = document.getElementById('otpDisplay').textContent;
            if (otp && !otp.includes('⏳') && !otp.includes('⏰')) {
                copyToClipboard(otp);
                showToast('✅ Đã copy code!');
            }
        }

        function copyCustom() {
            const text = document.getElementById('customString').value.trim();
            if (text) {
                copyToClipboard(text);
                showToast('✅ Đã copy!');
            } else {
                showToast('⚠️ Chuỗi rỗng!');
            }
        }

        // ============ RANDOM ============
        function random1to10() {
            const num = Math.floor(Math.random() * 10) + 1;
            const formatted = String(num).padStart(2, '0');
            copyToClipboard(formatted);
            showToast(`✅ Đã copy: ${formatted}`);
            addDebug(`🎲 Random 1-10: ${formatted}`, 'INFO');
        }

        function random1975to2002() {
            const num = Math.floor(Math.random() * (2002 - 1975 + 1)) + 1975;
            const formatted = String(num);
            copyToClipboard(formatted);
            showToast(`✅ Đã copy: ${formatted}`);
            addDebug(`🎰 Random 1975-2002: ${formatted}`, 'INFO');
        }

        // ============ CLEANUP ============
        window.addEventListener('beforeunload', () => {
            stopPolling();
        });
    </script>
</body>
</html>
