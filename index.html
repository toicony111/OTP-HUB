<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OTP Hub Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 8px;
            max-width: 400px;
            width: 100%;
            height: 100vh;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .header {
            text-align: center;
            flex-shrink: 0;
            padding: 2px 0;
        }

        .header h1 {
            color: #333;
            font-size: 16px;
            line-height: 1.2;
        }

        .api-setup {
            background: #f8f9fa;
            border-radius: 6px;
            padding: 6px;
            border: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        .api-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .api-row input {
            flex: 1;
            padding: 6px 8px;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            font-size: 12px;
        }

        .api-row input:focus {
            outline: none;
            border-color: #667eea;
        }

        .api-row button {
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            background: #667eea;
            white-space: nowrap;
        }

        .api-row button:active { opacity: 0.8; }

        .save-key {
            font-size: 10px;
            color: #666;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .save-key select {
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 3px;
            border: 1px solid #ddd;
        }

        .api-status {
            text-align: center;
            padding: 4px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            flex-shrink: 0;
            min-height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .api-status.success { background: #d4edda; color: #155724; }
        .api-status.error { background: #f8d7da; color: #721c24; }
        .api-status.idle { background: #e2e3e5; color: #383d41; }
        .api-status.loading { background: #fff3cd; color: #856404; }

        .sections-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow-y: auto;
            min-height: 0;
        }

        .section {
            padding: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        .section h2 {
            color: #555;
            font-size: 11px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .btn {
            width: 100%;
            padding: 6px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.8; transform: scale(0.98); }

        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-success { background: #28a745; }
        .btn-warning { background: #ff6b6b; }
        .btn-info { background: #17a2b8; }
        .btn-secondary { background: #6c757d; }

        .btn-small { width: auto; padding: 4px 8px; font-size: 10px; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }

        .btn-row {
            display: flex;
            gap: 4px;
        }

        .btn-row .btn { flex: 1; }

        .input-group {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .input-group input {
            flex: 1;
            padding: 6px 8px;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            font-size: 12px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #17a2b8;
        }

        .copy-feedback {
            font-size: 9px;
            color: #28a745;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            height: 14px;
            line-height: 14px;
        }

        .copy-feedback.show { opacity: 1; }

        .phone-display {
            background: white;
            padding: 6px;
            border-radius: 4px;
            border: 2px solid #667eea;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            margin: 4px 0;
            word-break: break-all;
        }

        .otp-display {
            background: white;
            padding: 8px;
            border-radius: 4px;
            border: 2px solid #ffc107;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin: 4px 0;
            word-break: break-all;
            letter-spacing: 2px;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .otp-display.waiting {
            color: #999;
            font-size: 11px;
            font-weight: normal;
            letter-spacing: 0;
        }

        .rental-info {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 9px;
            color: #856404;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .loader {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        .loader-dark {
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top-color: #667eea;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .debug-panel {
            background: #1a1a1a;
            color: #00ff00;
            padding: 6px;
            border-radius: 4px;
            font-size: 8px;
            font-family: monospace;
            max-height: 80px;
            overflow-y: auto;
            margin-top: 4px;
            display: none;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 OTP Hub Tool v2</h1>
        </div>

        <!-- API Key -->
        <div class="api-setup">
            <div class="api-row">
                <input 
                    type="password" 
                    id="apiKeyInput" 
                    placeholder="Nhập API Key..."
                    autocomplete="off"
                >
                <button onclick="connectAPI()" id="btnConnect">
                    Kết nối
                </button>
            </div>
            <div class="save-key">
                <input type="checkbox" id="rememberKey" checked>
                <label>Lưu Key</label>
                <label style="margin-left:8px;">Mode:</label>
                <select id="modeSelect">
                    <option value="direct">Direct API</option>
                    <option value="proxy">CORS Proxy</option>
                </select>
            </div>
        </div>

        <div class="api-status idle" id="apiStatus">
            ⚡ Nhập API Key và nhấn "Kết nối"
        </div>

        <div class="sections-wrapper">
            <!-- Thuê số + OTP -->
            <div class="section">
                <h2>📱 Thuê số US - Rips By TriumPh</h2>
                <div class="btn-row">
                    <button class="btn btn-primary" id="btnRentPhone" onclick="rentPhone()" disabled>
                        📞 Thuê số mới
                    </button>
                    <button class="btn btn-secondary btn-small" id="btnCancelOrder" onclick="cancelOrder()" disabled>
                        ❌ Hủy
                    </button>
                </div>
                
                <div class="phone-display" id="phoneDisplay" style="display: none;">
                    📱 <span id="phoneNumber"></span>
                </div>
                
                <div class="otp-display waiting" id="otpDisplay">
                    ⏳ Chưa có code
                </div>
                
                <div class="btn-row" id="otpActions" style="display: none;">
                    <button class="btn btn-info btn-small" onclick="copyOTP()">
                        📋 Copy Code
                    </button>
                    <button class="btn btn-warning btn-small" id="btnResend" onclick="resendSMS()" disabled>
                        🔄 Gửi lại
                    </button>
                </div>
                
                <div class="rental-info" id="rentalInfo" style="display: none;">
                    <span>ID: <span id="orderIdInfo"></span></span>
                    <span>Hết hạn: <span id="expiresInfo"></span>s</span>
                    <span>Resend: <span id="resendCount">0</span></span>
                </div>
                <div class="copy-feedback" id="phoneFeedback">✅ Đã copy số!</div>
                <div class="copy-feedback" id="otpFeedback">✅ Đã copy code!</div>
                <div class="debug-panel" id="debugPanel"></div>
            </div>

            <!-- Random 1 -->
            <div class="section">
                <h2>🎲 Random (01-10)</h2>
                <button class="btn btn-success" onclick="random1to10()">
                    Random & Copy
                </button>
                <div class="copy-feedback" id="random1Feedback">✅ Đã copy!</div>
            </div>

            <!-- Random 2 -->
            <div class="section">
                <h2>🎰 Random (1975-2002)</h2>
                <button class="btn btn-warning" onclick="random1975to2002()">
                    Random & Copy
                </button>
                <div class="copy-feedback" id="random2Feedback">✅ Đã copy!</div>
            </div>

            <!-- Custom String -->
            <div class="section">
                <h2>✏️ Chuỗi tùy chỉnh</h2>
                <div class="input-group">
                    <input type="text" id="customString" value="DMXFXQD">
                    <button class="btn btn-info btn-small" onclick="copyCustomString()">
                        Copy
                    </button>
                </div>
                <div class="copy-feedback" id="customFeedback">✅ Đã copy!</div>
            </div>
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const BASE_URL = 'https://api.otphub.net/api/v1';
        const COUNTRY_US = '1';
        
        // ============ STATE ============
        let API_KEY = '';
        let SERVICE_TRUMP = null;
        let currentOrderId = null;
        let pollInterval = null;
        let pollCount = 0;
        let maxPollCount = 120; // 10 phút
        let phoneNumber = '';
        let currentOTP = '';
        let otpReceived = false;
        let useProxy = false;
        
        // ============ DOM ============
        const apiKeyInput = document.getElementById('apiKeyInput');
        const rememberCheck = document.getElementById('rememberKey');
        const apiStatus = document.getElementById('apiStatus');
        const btnRentPhone = document.getElementById('btnRentPhone');
        const btnCancelOrder = document.getElementById('btnCancelOrder');
        const btnResend = document.getElementById('btnResend');
        const btnConnect = document.getElementById('btnConnect');
        const otpDisplay = document.getElementById('otpDisplay');
        const otpActions = document.getElementById('otpActions');
        const modeSelect = document.getElementById('modeSelect');
        const debugPanel = document.getElementById('debugPanel');

        // ============ DEBUG ============
        function logDebug(msg, data = null) {
            const time = new Date().toLocaleTimeString();
            let logMsg = `[${time}] ${msg}`;
            
            if (data) {
                try {
                    logMsg += ' | ' + JSON.stringify(data).substring(0, 200);
                } catch(e) {}
            }
            
            console.log(logMsg);
            debugPanel.style.display = 'block';
            debugPanel.innerHTML = logMsg + '<br>' + debugPanel.innerHTML;
            
            // Giới hạn 15 dòng
            const lines = debugPanel.innerHTML.split('<br>');
            if (lines.length > 15) {
                debugPanel.innerHTML = lines.slice(0, 15).join('<br>');
            }
        }

        // ============ INIT ============
        function loadSavedKey() {
            const saved = localStorage.getItem('otphub_api_key_v2');
            if (saved) {
                apiKeyInput.value = saved;
                rememberCheck.checked = true;
            }
        }

        function saveSettings() {
            if (rememberCheck.checked && API_KEY) {
                localStorage.setItem('otphub_api_key_v2', API_KEY);
            } else {
                localStorage.removeItem('otphub_api_key_v2');
            }
        }

        // ============ CONNECT ============
        async function connectAPI() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                apiStatus.textContent = '❌ Vui lòng nhập API Key';
                apiStatus.className = 'api-status error';
                return;
            }
            
            API_KEY = key;
            useProxy = modeSelect.value === 'proxy';
            saveSettings();
            
            btnConnect.disabled = true;
            btnConnect.textContent = '...';
            btnRentPhone.disabled = true;
            SERVICE_TRUMP = null;
            
            apiStatus.innerHTML = '<span class="loader loader-dark"></span> Đang kết nối...';
            apiStatus.className = 'api-status loading';
            
            logDebug('🔌 Connecting with mode: ' + (useProxy ? 'PROXY' : 'DIRECT'));
            
            try {
                const data = await apiCall('/services', 'GET');
                
                logDebug('Services response success:', data.success);
                
                if (data.success && data.data && Array.isArray(data.data)) {
                    logDebug(`Found ${data.data.length} services`);
                    
                    const trumpService = findTrumpService(data.data);
                    
                    if (trumpService) {
                        SERVICE_TRUMP = trumpService.ID;
                        apiStatus.textContent = `✅ ${trumpService.name} (ID: ${trumpService.ID})`;
                        apiStatus.className = 'api-status success';
                        btnRentPhone.disabled = false;
                        logDebug('✅ Service found: ' + trumpService.name, {id: trumpService.ID});
                    } else {
                        apiStatus.textContent = '❌ Không tìm thấy dịch vụ Trump';
                        apiStatus.className = 'api-status error';
                        
                        const trumpRelated = data.data.filter(s => 
                            s.name.toLowerCase().includes('trump') || 
                            s.name.toLowerCase().includes('rips') || 
                            s.name.toLowerCase().includes('triumph')
                        );
                        logDebug('Trump-related services:', trumpRelated.map(s => s.ID + ':' + s.name));
                        
                        if (trumpRelated.length === 0) {
                            logDebug('ALL services:', data.data.slice(0, 10).map(s => s.ID + ':' + s.name));
                        }
                    }
                } else {
                    throw new Error('Invalid response structure');
                }
            } catch (error) {
                apiStatus.textContent = '❌ ' + error.message;
                apiStatus.className = 'api-status error';
                logDebug('❌ Connect error: ' + error.message);
            } finally {
                btnConnect.disabled = false;
                btnConnect.textContent = 'Kết nối';
            }
        }

        // ============ API CALL - DIRECT OR PROXY ============
        async function apiCall(endpoint, method = 'GET', body = null) {
            if (!API_KEY) throw new Error('Chưa có API Key');
            
            let url = `${BASE_URL}${endpoint}`;
            const headers = {
                'Content-Type': 'application/json',
                'x-api-key': API_KEY
            };
            
            // Với GET, thêm key vào URL (backup)
            if (method === 'GET') {
                url += url.includes('?') ? `&key=${API_KEY}` : `?key=${API_KEY}`;
            }
            
            const fetchOptions = {
                method: method,
                headers: headers
            };
            
            if (body && (method === 'POST' || method === 'PUT')) {
                fetchOptions.body = JSON.stringify(body);
            }
            
            if (useProxy) {
                // Dùng CORS proxy
                return await callViaProxy(url, fetchOptions);
            } else {
                // Gọi trực tiếp
                return await callDirect(url, fetchOptions);
            }
        }
        
        async function callDirect(url, fetchOptions) {
            logDebug('🔄 Direct call: ' + fetchOptions.method + ' ' + url.substring(0, 80));
            
            try {
                const response = await fetch(url, fetchOptions);
                
                logDebug('📡 Response status: ' + response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText.substring(0, 100)}`);
                }
                
                const data = await response.json();
                logDebug('✅ Direct success');
                return data;
                
            } catch (error) {
                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    logDebug('⚠️ Direct failed (CORS?), trying proxy...');
                    useProxy = true;
                    modeSelect.value = 'proxy';
                    return await callViaProxy(url, fetchOptions);
                }
                throw error;
            }
        }
        
        async function callViaProxy(url, fetchOptions) {
            const proxies = [
                { name: 'allorigins', url: 'https://api.allorigins.win/raw?url=' },
                { name: 'corsproxy', url: 'https://corsproxy.io/?' },
                { name: 'codetabs', url: 'https://api.codetabs.com/v1/proxy?quest=' }
            ];
            
            for (let proxy of proxies) {
                try {
                    const proxyUrl = proxy.url + encodeURIComponent(url);
                    logDebug('🔄 Trying proxy: ' + proxy.name);
                    
                    // Proxy chỉ forward GET requests, với POST cần xử lý khác
                    const proxyFetchOptions = {
                        method: fetchOptions.method,
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    };
                    
                    // Với POST qua proxy, gửi body
                    if (fetchOptions.body) {
                        proxyFetchOptions.body = fetchOptions.body;
                    }
                    
                    const response = await fetch(proxyUrl, proxyFetchOptions);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    logDebug('✅ Proxy success: ' + proxy.name);
                    return data;
                    
                } catch (error) {
                    logDebug('❌ Proxy ' + proxy.name + ' failed: ' + error.message);
                }
            }
            
            throw new Error('Tất cả proxy đều thất bại. Thử dùng Direct mode hoặc VPN.');
        }

        // ============ FIND SERVICE ============
        function findTrumpService(services) {
            const searchTerms = [
                'Rips By TriumPh',
                'rips by triumph',
                'RIPS BY TRIUMPH',
                'Rips By Triumph'
            ];
            
            for (let term of searchTerms) {
                const found = services.find(s => s.name === term);
                if (found) return found;
            }
            
            let service = services.find(s => 
                s.name.toLowerCase().includes('rips') && 
                s.name.toLowerCase().includes('triumph')
            );
            if (service) return service;
            
            service = services.find(s => s.name.toLowerCase().includes('triumph'));
            if (service) return service;
            
            service = services.find(s => s.name.toLowerCase().includes('rips'));
            if (service) return service;
            
            return services.find(s => s.name.toLowerCase().includes('trump'));
        }

        // ============ ORDER ACTIONS ============
        async function cancelOrder() {
            if (!currentOrderId) return;
            
            logDebug('Cancelling order: ' + currentOrderId);
            
            try {
                const data = await apiCall(`/order/${currentOrderId}/cancel`, 'POST');
                logDebug('Cancel response:', data);
                
                if (data.success) {
                    stopPolling();
                    resetOrderUI();
                    apiStatus.textContent = '✅ Đã hủy, hoàn: ' + (data.data?.refunded_amount || '?') + ' VND';
                    apiStatus.className = 'api-status success';
                }
            } catch (error) {
                logDebug('Cancel error: ' + error.message);
                alert('Lỗi hủy: ' + error.message);
            }
        }

        async function resendSMS() {
            if (!currentOrderId) return;
            
            logDebug('Resending SMS for order: ' + currentOrderId);
            
            btnResend.disabled = true;
            btnResend.innerHTML = '<span class="loader"></span>';
            
            try {
                const data = await apiCall(`/order/${currentOrderId}/resend`, 'POST');
                logDebug('Resend response:', data);
                
                if (data.success) {
                    document.getElementById('resendCount').textContent = data.data?.resends || '1';
                    otpReceived = false;
                    currentOTP = '';
                    pollCount = 0;
                    otpDisplay.textContent = '⏳ Đang chờ code...';
                    otpDisplay.className = 'otp-display waiting';
                    otpActions.style.display = 'none';
                    startPolling();
                }
            } catch (error) {
                logDebug('Resend error: ' + error.message);
                alert('Lỗi: ' + error.message);
            } finally {
                btnResend.disabled = false;
                btnResend.innerHTML = '🔄 Gửi lại';
            }
        }

        async function rentPhone() {
            if (!SERVICE_TRUMP) {
                alert('Chưa kết nối! Nhập API Key và nhấn Kết nối.');
                return;
            }
            
            if (currentOrderId) {
                try { await cancelOrder(); } catch (e) {}
            }

            btnRentPhone.disabled = true;
            btnRentPhone.innerHTML = '<span class="loader"></span> Đang thuê...';
            
            logDebug('📞 Renting phone...');
            logDebug('Service ID: ' + SERVICE_TRUMP + ', Country: ' + COUNTRY_US);
            
            try {
                const orderBody = {
                    country: COUNTRY_US,
                    service: String(SERVICE_TRUMP)
                };
                
                logDebug('Order body:', orderBody);
                
                const data = await apiCall('/order', 'POST', orderBody);
                
                logDebug('📞 Order response FULL:', data);
                
                if (data.success && data.data && data.data.order_id) {
                    // Xử lý số điện thoại
                    phoneNumber = data.data.phone.replace(/\D/g, '');
                    if (phoneNumber.startsWith('1')) {
                        phoneNumber = phoneNumber.substring(1);
                    }
                    
                    currentOrderId = data.data.order_id;
                    otpReceived = false;
                    
                    document.getElementById('phoneDisplay').style.display = 'block';
                    document.getElementById('phoneNumber').textContent = phoneNumber;
                    document.getElementById('rentalInfo').style.display = 'flex';
                    document.getElementById('orderIdInfo').textContent = currentOrderId;
                    document.getElementById('expiresInfo').textContent = data.data.expires_in || 'N/A';
                    document.getElementById('resendCount').textContent = '0';
                    
                    currentOTP = '';
                    otpDisplay.textContent = '⏳ Đang chờ code...';
                    otpDisplay.className = 'otp-display waiting';
                    otpActions.style.display = 'none';
                    
                    btnCancelOrder.disabled = false;
                    btnResend.disabled = false;
                    
                    // Copy số điện thoại
                    await navigator.clipboard.writeText(phoneNumber);
                    showFeedback('phoneFeedback');
                    
                    logDebug('✅ ORDER CREATED - ID: ' + currentOrderId + ' | Phone: ' + phoneNumber + ' | Expires: ' + (data.data.expires_in || 'N/A') + 's');
                    
                    pollCount = 0;
                    startPolling();
                    
                } else {
                    logDebug('❌ Order failed - Response:', data);
                    throw new Error(data.message || 'Không thể thuê số - Response không có order_id');
                }
            } catch (error) {
                logDebug('❌ Rent error: ' + error.message);
                alert('❌ Lỗi thuê số: ' + error.message + '\n\nKiểm tra Debug Log để biết chi tiết.');
                resetOrderUI();
            } finally {
                btnRentPhone.disabled = false;
                btnRentPhone.innerHTML = '📞 Thuê số mới';
            }
        }

        // ============ POLL OTP ============
        function startPolling() {
            stopPolling();
            pollCount = 0;
            otpReceived = false;
            
            logDebug('🔄 Starting OTP poll for order: ' + currentOrderId);
            
            // Poll ngay lập tức
            pollOTP();
            
            pollInterval = setInterval(() => {
                if (!otpReceived && currentOrderId) {
                    pollOTP();
                }
            }, 5000);
        }

        async function pollOTP() {
            if (!currentOrderId || otpReceived) return;
            
            pollCount++;
            
            if (pollCount > maxPollCount) {
                stopPolling();
                otpDisplay.textContent = '⏰ Hết thời gian chờ';
                otpDisplay.className = 'otp-display waiting';
                logDebug('⏰ Poll timeout after ' + maxPollCount + ' attempts');
                return;
            }
            
            try {
                const data = await apiCall(`/order/${currentOrderId}`, 'GET');
                
                if (data.success && data.data) {
                    // Cập nhật expires
                    if (data.data.expires_in !== undefined) {
                        document.getElementById('expiresInfo').textContent = data.data.expires_in;
                    }
                    
                    // Log mỗi 5 lần poll để tránh spam
                    if (pollCount % 5 === 0) {
                        logDebug(`Poll #${pollCount} | Status: ${data.data.status} | OTP: ${data.data.otp || 'NULL'}`, {
                            status: data.data.status,
                            otp: data.data.otp,
                            full_sms: data.data.full_sms
                        });
                    }
                    
                    // Kiểm tra OTP - thử nhiều field
                    let otpValue = null;
                    
                    if (data.data.otp && String(data.data.otp).trim().length > 0 && data.data.otp !== 'null') {
                        otpValue = String(data.data.otp).trim();
                    } else if (data.data.code && String(data.data.code).trim().length > 0 && data.data.code !== 'null') {
                        otpValue = String(data.data.code).trim();
                    }
                    
                    // Nếu có full_sms, thử extract code
                    if (!otpValue && data.data.full_sms) {
                        const match = data.data.full_sms.match(/\b(\d{4,8})\b/);
                        if (match) {
                            otpValue = match[1];
                            logDebug('🔍 Extracted OTP from SMS: ' + otpValue);
                        }
                    }
                    
                    // Hiển thị OTP nếu có
                    if (otpValue && otpValue !== currentOTP) {
                        currentOTP = otpValue;
                        otpReceived = true;
                        
                        otpDisplay.textContent = otpValue;
                        otpDisplay.className = 'otp-display';
                        otpActions.style.display = 'flex';
                        
                        logDebug('🎉🎉 OTP RECEIVED: ' + otpValue + ' | Status: ' + data.data.status);
                        
                        // Tự động copy
                        await navigator.clipboard.writeText(otpValue);
                        showFeedback('otpFeedback');
                        
                        apiStatus.textContent = '✅ OTP: ' + otpValue;
                        apiStatus.className = 'api-status success';
                        
                        if (data.data.status === 'completed') {
                            stopPolling();
                            logDebug('✅ Order completed, stopping poll');
                        }
                    }
                }
            } catch (error) {
                if (pollCount % 5 === 0) {
                    logDebug('Poll #' + pollCount + ' error: ' + error.message);
                }
            }
        }

        function stopPolling() {
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
                logDebug('⏹️ Polling stopped');
            }
        }

        function resetOrderUI() {
            stopPolling();
            currentOrderId = null;
            currentOTP = '';
            phoneNumber = '';
            otpReceived = false;
            document.getElementById('phoneDisplay').style.display = 'none';
            document.getElementById('rentalInfo').style.display = 'none';
            otpDisplay.textContent = '⏳ Chưa có code';
            otpDisplay.className = 'otp-display waiting';
            otpActions.style.display = 'none';
            btnCancelOrder.disabled = true;
            btnResend.disabled = true;
        }

        // ============ COPY ============
        async function copyOTP() {
            if (currentOTP) {
                await navigator.clipboard.writeText(currentOTP);
                showFeedback('otpFeedback');
            }
        }

        async function random1to10() {
            const num = Math.floor(Math.random() * 10) + 1;
            await copyToClipboard(num.toString().padStart(2, '0'));
            showFeedback('random1Feedback');
        }

        async function random1975to2002() {
            const num = Math.floor(Math.random() * (2002 - 1975 + 1)) + 1975;
            await copyToClipboard(num.toString());
            showFeedback('random2Feedback');
        }

        async function copyCustomString() {
            const str = document.getElementById('customString').value.trim();
            if (str) {
                await copyToClipboard(str);
                showFeedback('customFeedback');
            }
        }

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
            } catch (err) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            }
        }

        function showFeedback(elementId) {
            const el = document.getElementById(elementId);
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1200);
        }

        // ============ EVENTS ============
        modeSelect.addEventListener('change', () => {
            useProxy = modeSelect.value === 'proxy';
            logDebug('Mode changed to: ' + (useProxy ? 'PROXY' : 'DIRECT'));
        });

        rememberCheck.addEventListener('change', saveSettings);

        apiKeyInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') connectAPI();
        });

        window.addEventListener('beforeunload', () => stopPolling());

        // ============ START ============
        loadSavedKey();
        useProxy = modeSelect.value === 'proxy';
        logDebug('🚀 Tool started | Mode: ' + (useProxy ? 'PROXY' : 'DIRECT'));
        logDebug('💡 Tip: Nếu Direct bị lỗi CORS, tool sẽ tự chuyển sang Proxy');
    </script>
</body>
</html>
